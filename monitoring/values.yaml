prometheus:
  prometheusSpec:
    serviceMonitorSelector:
      matchLabels:
        release: monitoring

    serviceMonitorNamespaceSelector: {}

    podMonitorSelector:
      matchLabels:
        release: monitoring

    podMonitorNamespaceSelector: {}

    additionalRulesForClusterRole:
      - apiGroups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
          - podmonitors
        verbs:
          - get
          - list
          - watch

grafana:
   persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 2Gi

sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"