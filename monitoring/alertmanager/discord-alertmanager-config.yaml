apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: devops-app-discord
  namespace: dev
  labels:
    release: monitoring
spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - severity
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
    matchers:
      - name: namespace
        value: dev
        matchType: "="

  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: discord-webhook
            key: url
          sendResolved: true
          title: '{{ .Status | toUpper }} - {{ .CommonLabels.alertname }}'
          message: |
            **Severity:** {{ .CommonLabels.severity }}
            **Namespace:** {{ .CommonLabels.namespace }}
            **Alert:** {{ .CommonLabels.alertname }}

            {{ range .Alerts }}
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}