name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t aldocloud/devops-kubernetes-project:${{ github.sha }} \
            -t aldocloud/devops-kubernetes-project:latest \
            ./app

      - name: Push Docker Image
        run: |
          docker push aldocloud/devops-kubernetes-project:${{ github.sha }}
          docker push aldocloud/devops-kubernetes-project:latest