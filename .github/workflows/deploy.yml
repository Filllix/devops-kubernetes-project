name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          -t aldocloud/devops-kubernetes-project:latest \
          -t aldocloud/devops-kubernetes-project:${{ github.sha }} \
          ./app

      - name: Push Image
        run: |
          docker push aldocloud/devops-kubernetes-project:latest
          docker push aldocloud/devops-kubernetes-project:${{ github.sha }}
          