apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-app.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{-include "devops-app.selectorLabels" . | nindent 4  }}
  template:
    metadata:
      labels:
        app: {{-include "devops-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: devops-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: {{ include "devops-app.fullname" . }}-config
            - secretRef:
                name: {{ include "devops-app.fullname" . }}-secret

          livenessProbe:
              httpGet:
                path: /health
                port: 3000
              initialDelaySeconds: 10
              periodSeconds: 5

          readinessProbe:
              httpGet:
                path: /health
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 3

          resources:
              requests:
                cpu: "100m"
                memory: "128Mi"

              limits:
                cpu: "300m"
                memory: "256Mi"