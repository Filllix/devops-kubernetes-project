apiVersion: v1
kind: Pod

metadata:
  name: storage-test
  namespace: dev

spec:
  containers:
  - name: busybox
    image: busybox

    command:
      - sleep
      - "3600"

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    volumeMounts:
      - mountPath: /data
        name: storage

  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: devops-pvc