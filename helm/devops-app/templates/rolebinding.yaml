apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: {{ include "devops-app.fullname" . }}

subjects:
- kind: ServiceAccount
  name: {{ include "devops-app.fullname" . }}

roleRef:
  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: {{ include "devops-app.fullname" . }}