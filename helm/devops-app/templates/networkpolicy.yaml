apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-devops-app
  namespace: dev

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: devops-app

  policyTypes:
    - Ingress

  ingress:
    # NGINX Ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

    # Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000

    # Internal testing
    - from:
        - podSelector:
            matchLabels:
              access: "true"
      ports:
        - protocol: TCP
          port: 3000