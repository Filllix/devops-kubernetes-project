replicaCount: 2

image:
  repository: aldocloud/devops-kubernetes-project
  pullPolicy: IfNotPresent
  tag: 9d1508d3e58c2e1f6e454b3ad741bb0e5dc6ce2e

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 250m
    memory: 256Mi

volumeMounts: []

config:
  appName: "DevOps Kubernetes Project"
  appEnv: "production"
  appVersion: latest

secret:
  create: false
  existingSecret: devops-app-secret

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

pdb:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

terminationGracePeriodSeconds: 30

lifecycle:
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 5
