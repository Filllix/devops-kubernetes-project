apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
        access: "true"
    spec:
      containers:
        - name: load-generator
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 20); do
                while true; do
                  wget -q -O- http://devops-app > /dev/null
                done &
              done
              wait
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi