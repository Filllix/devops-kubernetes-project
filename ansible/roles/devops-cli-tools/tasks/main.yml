---
- name: Install AWS CLI prerequisites
  ansible.builtin.apt:
    name:
      - unzip
      - curl
    state: present
    update_cache: true

- name: Download AWS CLI installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: "0644"

- name: Extract AWS CLI installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true

- name: Install or update AWS CLI
  ansible.builtin.command:
    cmd: /tmp/aws/install --update
  changed_when: false

- name: Download kubectl
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Download Helm archive
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
    dest: /tmp/helm.tar.gz
    mode: "0644"

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: true

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true
