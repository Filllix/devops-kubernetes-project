---
- name: Configure Nginx with Handler
  hosts: local
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create custom Nginx index page
      ansible.builtin.copy:
        content: |
          <html>
          <head>
              <title>Ansible Lab</title>
          </head>
          <body>
              <h1>Nginx configured by Ansible</h1>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
